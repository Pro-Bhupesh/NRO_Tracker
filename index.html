<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NRO Tracker">
<title>NRO Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Design system. Layout idea: quiet white surfaces on a cool grey page, one blue, one orange accent;
   desktop = collapsible sidebar + roomy content; phone = app bar, bottom bar with four destinations, bottom sheets. */
:root{
  color-scheme:light;
  --blue:#1559A8; --blue2:#2878C8; --accent:#F5A623; --bg:#F7F9FC; --surface:#FFFFFF;
  --ink:#172B4D; --ink2:#44546F; --muted:#66758C; --line:#E7ECF3; --soft:#F1F5FA; --tint:#E9F2FC;
  --ok:#16865B; --ok-bg:#E5F5EC; --warn:#9A6400; --warn-c:#D99118; --warn-bg:#FDF3DC; --bad:#C63B3B; --bad-c:#D94B4B; --bad-bg:#FCEBEB;
  --r:12px; --r-sm:10px; --s1:4px; --s2:8px; --s3:16px; --s4:24px;
  --sh:0 1px 2px rgba(23,43,77,.05),0 2px 10px rgba(23,43,77,.04); --sh2:0 16px 48px rgba(23,43,77,.2);
  --f:"Inter","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  --navh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
[hidden]{display:none !important}
h1,h2,h3,p,ul{margin:0} ul{padding:0;list-style:none}
h1{font-size:20px;font-weight:600;letter-spacing:-.01em} h2{font-size:15px;font-weight:600} h3{font-size:15px;font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none}
.note,.hint{font-size:12.5px;color:var(--muted)} .hint{padding:0 4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.m-only{display:none !important}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.app.mini{grid-template-columns:68px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:8px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;padding:6px 6px 14px;min-width:0}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 10.5px var(--f);letter-spacing:.02em;flex:none;box-shadow:inset 0 -3px 0 var(--accent)}
.logo b{font-size:15px;display:block;line-height:1.2;white-space:nowrap} .logo span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border:0;background:none;border-radius:var(--r-sm);color:var(--ink2);font-weight:500;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav .ni{display:grid;place-items:center} .nav .ic{width:19px;height:19px}
.nav button:hover{background:var(--soft)}
.nav button[aria-current]{background:var(--tint);color:var(--blue);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.profile,.collapse{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm);border:0;background:none;cursor:pointer;text-align:left;width:100%;min-width:0;color:var(--ink2)}
.profile:hover,.collapse:hover{background:var(--soft)}
.profile div{min-width:0;flex:1} .profile b{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px} .profile span{font-size:12px;color:var(--muted)}
.collapse{font-size:13px;height:36px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none;border:0}
.mini .logo div,.mini .nav .nl,.mini .profile div,.mini .profile>.ic,.mini .collapse span{display:none}
.mini .nav button,.mini .profile,.mini .collapse{justify-content:center;padding:0}
.mini .profile{padding:6px 0}
.col-main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;min-height:60px;display:flex;align-items:center;gap:10px;padding:0 28px;background:rgba(247,249,252,.88);backdrop-filter:saturate(1.4) blur(10px)}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-tag{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:99px;white-space:nowrap}
.content{padding:4px 28px 48px;width:100%;max-width:1320px;display:flex;flex-direction:column;gap:16px}
.content.enter>*{animation:rise .28s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.enter .meter i,.enter .phases b{animation:grow .6s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.head{display:flex;align-items:center;gap:10px;min-height:0}
.crumb-b{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px 8px 6px 2px;border-radius:8px;font-weight:500}
.crumb-b:hover{color:var(--ink);background:var(--soft)}

/* ---- buttons, inputs, chips ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,transform .08s,box-shadow .15s}
.btn:hover{background:#114b8f} .btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)} .btn.ghost:hover{background:var(--soft)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#3d2a00}
.btn.sm{height:32px;padding:0 10px;font-size:13px;border-radius:8px} .btn.sm .ic{width:15px;height:15px}
.btn.wide{width:100%;height:46px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:36px;height:36px;border-radius:10px;border:0;background:none;color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:hover{background:var(--soft)} .ibtn:active{transform:scale(.94)} .ibtn.sm{width:30px;height:30px}
.link{background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;font-size:13px}
select,input[type=text],input[type=number],input[type=date],input[type=search],input[type=password],input:not([type]),textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;max-width:100%;min-height:38px;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:0;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(40,120,200,.16)}
input:user-invalid,select:user-invalid{border-color:var(--bad-c)}
input[type=file]{font-size:13.5px;max-width:100%;color:var(--muted)}
input[type=file]::file-selector-button{font:inherit;font-weight:600;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-right:10px;cursor:pointer}
label{font-size:12.5px;font-weight:500;color:var(--ink2);display:flex;flex-direction:column;gap:5px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form label.full{grid-column:1/-1} .form input,.form select,.form textarea{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--tint);color:var(--blue)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--tint);color:var(--blue);letter-spacing:.04em}
.fchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0} .fchips::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;flex:none}
.fchip i{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff} .fchip[aria-pressed="true"] i{color:rgba(255,255,255,.75)}
.meter{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:48px;flex:1}
.meter i{display:block;height:100%;background:var(--blue2);border-radius:99px}
.meter.lg{height:8px;flex:none}
.pm{display:flex;align-items:center;gap:8px;min-width:96px} .pm span{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;width:38px;text-align:right}
.phases{display:flex;gap:3px} .phases i{flex:1;height:5px;border-radius:99px;background:var(--soft);position:relative;overflow:hidden} .phases b{position:absolute;inset:0 auto 0 0;background:var(--blue2);border-radius:99px}
.dots{display:flex;gap:3px} .dots i{width:18px;height:18px;border-radius:5px;background:var(--soft);font:600 10px/18px var(--f);text-align:center;font-style:normal;color:var(--muted)} .dots i.on{background:var(--ok-bg);color:var(--ok)}

/* ---- surfaces ---- */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);min-width:0;overflow:hidden}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px 10px}
.ptitle.wk{justify-content:center;gap:12px} .ptitle.wk h2{min-width:170px;text-align:center}
.sec-h{display:flex;align-items:baseline;gap:8px}
.count{font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);padding:2px 8px;border-radius:99px} .count.bad{background:var(--bad-bg);color:var(--bad)}
.grid{display:grid;gap:16px} .two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))} .two>*{min-width:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:32px 20px;color:var(--muted)}
.empty .ic{width:28px;height:28px;color:#9AA8BC;margin-bottom:2px} .empty b{color:var(--ink);font-size:14px} .empty p{font-size:13px;max-width:36ch} .empty .btn{margin-top:8px}
.skel{border-radius:var(--r);background:linear-gradient(90deg,#edf1f6 25%,#f6f8fb 50%,#edf1f6 75%);background-size:200% 100%;animation:shim 1.2s infinite linear}
.skel.k{height:84px;flex:1} .skel.b{height:160px} .skel-row{display:flex;gap:12px}
@keyframes shim{to{background-position:-200% 0}}

/* ---- dashboard ---- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.kpi-i{width:34px;height:34px;border-radius:10px;background:var(--tint);color:var(--blue);display:grid;place-items:center;flex:none}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.3} .kpi b{display:block;font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.02em;font-variant-numeric:tabular-nums} .kpi small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.k-warn .kpi-i{background:var(--warn-bg);color:var(--warn-c)} .k-bad .kpi-i{background:var(--bad-bg);color:var(--bad-c)} .k-ok .kpi-i{background:var(--ok-bg);color:var(--ok)}
.k-bad b{color:var(--bad)} .k-warn b{color:var(--warn)}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;position:relative;flex-direction:row;align-items:center} .search .ic{position:absolute;left:12px;color:var(--muted)} .search input{width:100%;padding-left:40px !important;border-radius:99px;background:var(--surface)}
.tools-r{display:flex;gap:8px;flex-wrap:wrap} .tools-r select{font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pc{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;position:relative;overflow:hidden;transition:box-shadow .18s,transform .18s;min-width:0}
.pc::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--line)}
.pc.st-ok::before{background:var(--ok)} .pc.st-warn::before{background:var(--warn-c)} .pc.st-bad::before{background:var(--bad-c)}
.pc:hover{box-shadow:0 2px 4px rgba(23,43,77,.06),0 8px 24px rgba(23,43,77,.09);transform:translateY(-1px)} .pc:active{transform:scale(.99)}
.pc-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pc-t{min-width:0} .pc-t h3{font-size:16px;line-height:1.3;overflow-wrap:anywhere} .pc-t span{font-size:12.5px;color:var(--muted)}
.pc-pct{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;flex:none} .pc-pct i{font-style:normal;font-size:14px;font-weight:600;color:var(--muted);margin-left:1px}
.pc-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pc-day{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2);font-weight:500;white-space:nowrap} .pc-day .ic{width:14px;height:14px;color:var(--muted)}
.pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding-top:12px;border-top:1px solid var(--line)}
.pc-stats div{min-width:0} .pc-stats span,.hero-stats span,.facts span{display:block;font-size:11.5px;color:var(--muted);font-weight:500} .pc-stats b{font-weight:600;font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.att li{display:flex;gap:10px;align-items:center;padding:10px 16px;cursor:pointer;border-top:1px solid var(--line);transition:background .15s}
.att li:hover{background:var(--soft)} .att li.none{cursor:default;padding:0} .att li.none:hover{background:none} .att li.more{padding:10px 16px;font-size:12.5px;color:var(--muted)}
.att li>i{width:8px;height:8px;border-radius:50%;background:var(--warn-c);flex:none} .att li.bad>i{background:var(--bad-c)}
.att div{flex:1;min-width:0} .att b{display:block;font-weight:600;font-size:13px} .att span{display:block;font-size:12.5px;color:var(--muted)} .att .ic{color:#A9B5C6;width:16px;height:16px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ph{display:flex;flex-direction:column;gap:4px;min-width:0;text-decoration:none;color:inherit}
.ph .img{aspect-ratio:4/3;border-radius:10px;background:var(--soft);overflow:hidden} .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph b{font-weight:600;font-size:12.5px;overflow-wrap:anywhere;line-height:1.3} .ph span{font-size:11.5px;color:var(--muted)}

/* ---- project workspace ---- */
.hero{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:16px}
.hero-main{display:flex;gap:16px;align-items:center} .ring{flex:none}
.hero-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px} .hero-t h2{font-size:20px;letter-spacing:-.01em;overflow-wrap:anywhere} .hero-t>span{font-size:13px;color:var(--muted)}
.hero-edit{align-self:flex-start}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-top:14px;border-top:1px solid var(--line)}
.hero-stats b{font-size:17px;font-weight:700;display:block;margin-bottom:4px;font-variant-numeric:tabular-nums} .hero-stats small{font-size:12.5px;color:var(--muted);font-weight:500}
.hero-more summary{list-style:none;display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--blue);font-weight:600;font-size:13px;padding:4px 0} .hero-more summary::-webkit-details-marker{display:none}
.hero-more[open] summary .ic{transform:rotate(180deg)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 16px;padding-top:10px} .facts div{min-width:0;font-weight:500;overflow-wrap:anywhere}
.stepper{display:flex;background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:14px 8px;overflow-x:auto;scrollbar-width:none} .stepper::-webkit-scrollbar{display:none}
.stp{flex:1 0 108px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;padding:0 6px}
.stp::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line)} .stp:first-child::before{display:none}
.stp.done::before,.stp.on::before{background:var(--blue2)}
.stp-d{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);position:relative;z-index:1}
.stp.on .stp-d{border-color:var(--blue2);color:var(--blue)} .stp.done .stp-d{background:var(--blue);border-color:var(--blue);color:#fff} .stp-d .ic{width:14px;height:14px}
.stp b{font-size:12px;font-weight:600;line-height:1.25} .stp i{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--soft);padding:4px;border-radius:12px;align-self:flex-start;max-width:100%} .subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:0;background:none;height:34px;padding:0 14px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500;white-space:nowrap;flex:none}
.subtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(23,43,77,.12)}
.acts-tools{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.phase{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.phase summary{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;list-style:none} .phase summary::-webkit-details-marker{display:none}
.phase summary>.ic{color:var(--muted);transition:transform .2s} .phase[open] summary>.ic{transform:rotate(180deg)}
.ph-n{width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none} .ph-n.done{background:var(--ok-bg);color:var(--ok)} .ph-n .ic{width:14px;height:14px}
.ph-t{flex:1;min-width:0} .ph-t b{display:block;font-weight:600} .ph-t span{font-size:12px;color:var(--muted)}
.phase summary .pm{width:160px;flex:none}
.act{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:11px 16px;border-top:1px solid var(--line);align-items:start}
.act.tap{cursor:pointer;transition:background .15s} .act.tap:hover{background:#FAFCFE} .act.tap:active{background:var(--soft)}
.act-n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right}
.act-m{min-width:0;display:flex;flex-direction:column;gap:4px} .act-m b{font-weight:600;font-size:14px;line-height:1.35}
.act.s-C .act-m b{color:var(--ink2);font-weight:500} .act.s-N .act-m b{color:var(--muted);font-weight:500}
.act-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.own{font-weight:600;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--ink2)} .own.o-D{background:#FFF4E0;color:#8A5A00} .own.o-C{background:var(--tint);color:var(--blue)}
