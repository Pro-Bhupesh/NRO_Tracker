<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRO Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout idea: fixed navy sidebar for navigation, white work surface, dense tables with status chips; portfolio first, project detail second. */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#172b42; --muted:#637083; --line:#e1e6ed; --soft:#f0f3f7;
  --side:#0b2742; --side-ink:#c9d6e5; --brand:#0b3d6e; --accent:#f5a800; --accent-ink:#3a2a00; --bar:#1f6fb5;
  --ok:#17794a; --warn:#a86100; --bad:#b3261e; --ok-bg:#e3f4ea; --warn-bg:#fdf1d8; --bad-bg:#fce6e4;
  --f:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1520; --panel:#151f2d; --ink:#e4ebf3; --muted:#93a1b3; --line:#283547; --soft:#1c2838;
    --side:#091a2c; --side-ink:#c9d6e5; --brand:#2f7fc4; --accent:#f5a800; --accent-ink:#3a2a00; --bar:#4b9be0;
    --ok:#62d098; --warn:#efb450; --bad:#f28b82; --ok-bg:#16352a; --warn-bg:#3a2d12; --bad-bg:#41211e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1520; --panel:#151f2d; --ink:#e4ebf3; --muted:#93a1b3; --line:#283547; --soft:#1c2838;
  --side:#091a2c; --side-ink:#c9d6e5; --brand:#2f7fc4; --accent:#f5a800; --accent-ink:#3a2a00; --bar:#4b9be0;
  --ok:#62d098; --warn:#efb450; --bad:#f28b82; --ok-bg:#16352a; --warn-bg:#3a2d12; --bad-bg:#41211e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f)}
h1,h2,h3,p{margin:0} h1,h2,h3{text-wrap:balance;font-weight:600}
h1{font-size:20px} h2{font-size:15px} h3{font-size:13px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:16px 10px;display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.brand b{color:#fff;font-size:16px;letter-spacing:.01em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{font-size:12px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:transparent;border:0;border-left:3px solid transparent;color:inherit;padding:8px 10px;border-radius:0 6px 6px 0;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1);border-left-color:var(--accent);color:#fff;font-weight:500}
.nav em{font-style:normal;font-size:11px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;padding:0 8px;font-size:12px;display:flex;flex-direction:column;gap:6px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:#fff;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.content{padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:1240px}
.head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end}
.crumb{font-size:12px;color:var(--muted)}
.crumb button{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;text-decoration:underline}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ptitle{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.kpi:last-child{border-right:0}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--soft)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:4px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);letter-spacing:.03em}
.tag.cat{border-color:var(--brand);color:var(--brand)}
.meter{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:70px;flex:1}
.meter i{display:block;height:100%;background:var(--bar);border-radius:99px}
.pm{display:flex;align-items:center;gap:8px;min-width:120px}
.pm span{font-variant-numeric:tabular-nums;width:36px;text-align:right}
.phases{display:flex;gap:3px;min-width:120px}
.phases i{flex:1;height:14px;border-radius:2px;background:var(--soft);position:relative;overflow:hidden}
.phases i b{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.dots{display:flex;gap:3px}
.dots i{width:18px;height:18px;border-radius:3px;background:var(--soft);font:500 10px/18px var(--f);text-align:center;font-style:normal;color:var(--muted)}
.dots i.on{background:var(--ok-bg);color:var(--ok)}
.btn{background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn.alt{background:var(--panel);color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:72px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.note{font-size:12.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px}
.facts div{display:flex;flex-direction:column;gap:1px}
.facts span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0}
.step{padding:12px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.step:last-child{border-right:0}
.step span{font-size:12px;color:var(--muted)}
.step b{font-size:16px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
details{border-bottom:1px solid var(--line)} details:last-child{border-bottom:0}
summary{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;background:var(--soft);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";width:12px;color:var(--muted)} details[open] summary::before{content:"-"}
summary .pm{margin-left:auto;font-weight:400;width:180px}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);border-left:3px solid var(--warn)}
.att li.bad{border-left-color:var(--bad)} .att li:last-child{border-bottom:0}
.att b{font-weight:500}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.ph{display:flex;flex-direction:column;gap:5px;min-width:0;text-decoration:none;color:inherit}
.ph .img{aspect-ratio:4/3;border-radius:6px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph b{font-weight:500;font-size:12.5px;overflow-wrap:anywhere} .ph span{font-size:11.5px;color:var(--muted)}
.letter{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;white-space:pre-wrap;font-size:13.5px;max-width:70ch}
.plan td{text-align:center}
.cell{border:1px dashed var(--line);border-radius:5px;padding:4px 6px;font-size:12px;cursor:pointer;background:transparent;width:100%;min-width:62px;min-height:28px;color:var(--muted)}
.cell.planned{border-style:solid;background:var(--warn-bg);color:var(--warn)}
.cell.done{border-style:solid;background:var(--ok-bg);color:var(--ok)}
.cell.missed{border-style:solid;background:var(--bad-bg);color:var(--bad)}
.ovl{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:5}
.dlg{background:var(--panel);border-radius:10px;border:1px solid var(--line);width:100%;max-width:640px}
.dlg .form label{flex:1 1 180px}
.dlg input,.dlg select{width:100%}
a{color:var(--brand)}
@media (max-width:800px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px}
  .nav{flex-direction:row;overflow-x:auto;order:3;width:100%}
  .nav button{border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0}
  .nav button[aria-current="page"]{border-bottom-color:var(--accent)}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .content{padding:16px}
  .kpi,.step{border-right:0;border-bottom:1px solid var(--line)}
}

[hidden]{display:none !important}
.brand.dark b{color:var(--ink);font-size:20px} .brand.dark{padding:0}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth .dlg{max-width:420px} .auth input{width:100%}
.link{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;text-decoration:underline;font-size:13px}
.side .link{color:var(--side-ink);text-align:left}
.who{margin-top:auto;padding:0 8px;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.who b{color:#fff;font-weight:500}
label.inline{flex-direction:row;align-items:center;gap:6px}
.dlg textarea{width:100%}
.step.total{background:var(--soft)}
th.now{color:var(--ink);font-weight:700}
.att li.click{cursor:pointer} .att li.click:hover{background:var(--soft)}
.cell:disabled{cursor:default}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:9;transition:transform .2s;max-width:90vw}
.toast.show{transform:translateX(-50%)} .toast.bad{background:var(--bad);color:#fff}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent);z-index:9;animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.busy{animation:none}.toast{transition:none}}
@media (max-width:800px){.who{margin:0 0 0 auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}}
td.n,td .tag,td b{white-space:nowrap}
.att li.none{border-left-color:transparent}
.dots i{width:16px;height:16px;line-height:16px}
@media print{.side,.head .row,.crumb,.toast,.busy{display:none !important}.app{display:block}.content{padding:0;max-width:none}.letter{border:0;max-width:none;font-size:12pt;color:#000;background:#fff}body{background:#fff}}

table.acts{table-layout:fixed;min-width:900px}
table.acts th:nth-child(1){width:48px} table.acts th:nth-child(3){width:130px} table.acts th:nth-child(4){width:128px} table.acts th:nth-child(5){width:150px} table.acts th:nth-child(6){width:190px} table.acts th:nth-child(7){width:96px} table.acts th:nth-child(8){width:150px}
td .row{flex-wrap:nowrap;gap:6px}
@media (min-width:1000px){.steps{grid-template-columns:repeat(7,minmax(0,1fr))}}
.step .meter{flex:none;width:100%;height:6px}
.facts .pm{width:100%;max-width:180px}
table.acts{min-width:980px}
table.acts th:nth-child(6){width:170px} table.acts th:nth-child(8){width:140px}
.dlg.wide{max-width:980px}
.dlg.wide td input:not([type=number]){width:100%}

.auth.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);padding:0;align-items:stretch;background:#cfe4f8 url(landing-bg.jpg) center bottom/cover no-repeat}
.hero{color:#0a3a8c;padding:40px 48px;display:flex;flex-direction:column;gap:22px;min-width:0}
.hbrand{display:flex;align-items:center;gap:14px}
.hname{font-size:56px;line-height:1;color:#0a3a8c;font-weight:400;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(255,255,255,.7)} .hname b{font-weight:700}
.hname.sm{font-size:38px;text-align:center;text-shadow:none}
.pin{width:46px;height:58px;flex:none}
.tbe{display:flex;flex-wrap:wrap;gap:6px 34px;font-size:46px;font-weight:700;font-style:italic;line-height:1.1;text-shadow:0 1px 10px rgba(255,255,255,.7)}
.tbe .g{color:#f5a800;transform:translateY(-6px) rotate(-3deg);display:inline-block}
.auth.split .dlg.card{align-self:center;justify-self:center;width:calc(100% - 48px);max-width:440px;margin:24px;background:#fff;border:0;border-radius:22px;box-shadow:0 18px 50px rgba(10,58,140,.18);color:#172b42}
.auth.split .card .pad{gap:16px;padding:30px 30px 28px}
.crane{width:190px;display:block;margin:0 auto -4px}
.center{text-align:center;justify-content:center} .between{justify-content:space-between}
.fld{position:relative;flex-direction:row;align-items:center}
.fld>svg{position:absolute;left:14px;width:20px;height:20px;fill:#44536a}
.fld input{width:100%;padding:13px 44px;border:1px solid #cfd8e3;border-radius:10px;background:#f6f8fb;color:#172b42;font-size:15px}
.eye{position:absolute;right:8px;background:none;border:0;padding:6px;cursor:pointer;display:flex}
.eye svg{width:20px;height:20px;fill:#44536a}
.btn.wide{width:100%;padding:13px;font-size:16px;border-radius:10px;background:#0a3a8c;border-color:#0a3a8c}
.card .note{color:#5a6880} .card .link{color:#0a3a8c} .card .btn.alt{background:#fff;color:#172b42;border-color:#cfd8e3}
@media (max-width:900px){.auth.split{grid-template-columns:minmax(0,1fr);align-content:start;background:linear-gradient(180deg,#0a3a8c 0,#0a3a8c 100%)}.hero{aspect-ratio:3/2;background:#cfe4f8 url(landing-bg.jpg) center/cover no-repeat;padding:14px 16px;gap:8px}.hname{font-size:26px}.pin{width:22px;height:28px}.hbrand{gap:8px}.tbe{font-size:19px;gap:2px 12px}.tbe .g{transform:translateY(-2px) rotate(-3deg)}.auth.split .dlg.card{margin:-18px auto 24px;width:calc(100% - 32px);position:relative}.auth.split .card .pad{padding:22px 20px}.crane{width:130px}.hname.sm{font-size:30px}}
</style>
</head>
<body>
<div class="busy" id="busy" hidden></div>
<div id="full" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><b>NRO <i>Tracker</i></b><span>Belgaum Retail Territory</span></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main class="content" id="main"></main>
</div>
<div id="ovl"></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
